%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/quectel,pwrseq.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Quectel Modems GPIO Power sequences

maintainers:
  - Victor Bertin <victor.bertin@b-on.com>

description: |
  Power sequences for Quectel modems whose PWRKEY and RESET lines work as
  buttons : the line must be asserted for a given time and then released.

properties:
  compatible:
    enum:
      - quectel,ag35-pwrseq
      - quectel,eg915k-pwrseq
      - quectel,eg915n-pwrseq

  power-gpios:
    maxItems: 1
    description: GPIO connected to the modem PWRKEY input.

  reset-gpios:
    maxItems: 1
    description: GPIO connected to the modem RESET input.

  power-on-pulse-ms:
    description: |
      Duration to assert the PWRKEY line to power on the modem. Overrides the
      datasheet value of the modem.

  power-off-pulse-ms:
    description: |
      Duration to assert the PWRKEY line to power off the modem. Overrides the
      datasheet value of the modem.

  reset-pulse-ms:
    description: |
      Duration to assert the RESET line to reset the modem. Overrides the
      datasheet value of the modem.

required:
  - compatible
  - power-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    eg915-pwrseq {
        compatible = "quectel,eg915n-pwrseq";
        power-gpios = <&gpioa 1 GPIO_ACTIVE_HIGH>;
        reset-gpios = <&gpioa 2 GPIO_ACTIVE_HIGH>;
        power-on-pulse-ms = <600>;
    };
